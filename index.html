<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>glitch segmentation • rear camera</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: black; overflow: hidden; }
    #loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      flex-direction: column; gap: 20px; z-index: 200;
      transition: opacity 0.5s ease; pointer-events: none;
    }
    .loading-text { color: cyan; font-size: 1.8rem; text-align: center; font-family: monospace; }
    .loading-text small { font-size: 1rem; opacity: 0.8; }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(0,255,255,0.2);
      border-top: 4px solid cyan; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (max-width: 600px) { .loading-text { font-size: 1.4rem; } }
  </style>
</head>
<body>
<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">加载中...<br><small>Loading rear camera...</small></div>
</div>

<script>
  let bodySegmentation;
  let capture;
  let segmentation;
  let firstResultReceived = false;

  const options = { maskType: "person" };

  function preload() {
    bodySegmentation = ml5.bodySegmentation("SelfieSegmentation", options);
  }

  function setup() {
    createCanvas(windowWidth, windowHeight);
    pixelDensity(1);

    // Request rear camera with simple facingMode syntax
    capture = createCapture({
      video: { facingMode: "environment" },
      audio: false
    });
    
    capture.size(width, height);
    capture.hide();

    bodySegmentation.detectStart(capture, gotResults);
  }

  function gotResults(result) {
    segmentation = result;
    if (!firstResultReceived && result) {
      firstResultReceived = true;
      const overlay = document.getElementById("loading-overlay");
      overlay.style.opacity = "0";
      setTimeout(() => overlay.style.display = "none", 500);
    }
  }

  function draw() {
    if (!firstResultReceived) {
      if (capture && capture.elt.readyState >= 2) {
        // No mirroring for rear camera
        image(capture, 0, 0, width, height);
      }
      return;
    }

    if (segmentation && capture) {
      // No mirroring – rear camera shows natural orientation
      capture.mask(segmentation.mask);
      image(capture, 0, 0, width, height);
    } else if (capture) {
      image(capture, 0, 0, width, height);
    }

    // Glitch effects
    if (frameCount % 60 === 0 && random(1) > 0.65) {
      blendMode(ADD);
      fill(100, 255, 100, 5);
      noStroke();
      rect(0, 0, width, height);
      blendMode(BLEND);
    }

    if (frameCount % 37 === 0 && random(1) > 0.7) {
      loadPixels();
      for (let i = 0; i < pixels.length; i += 4) {
        pixels[i] = pixels[i] + 15;
      }
      updatePixels();
    }

    if (frameCount % 23 === 0 && random() > 0.8) {
      let sliceY = floor(random(height));
      let sliceH = floor(random(8, 30));
      copy(0, sliceY, width, sliceH, floor(random(-30, 30)), sliceY, width, sliceH);
    }
  }

  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
  }

  function touchStarted() {
    return false;
  }
</script>
</body>
</html>
